<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Viewport: width=device-width prevents zoom issues on iOS form inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>CraftCV — ATS Resume Builder</title>
    <meta name="description" content="Build ATS-optimized resumes that actually land interviews. Import your existing resume, paste a job description, and get a perfectly tailored PDF in minutes." />
    <meta name="keywords" content="resume builder, ATS resume, job application, CV builder, ATS score, resume optimizer" />
    <meta name="author" content="Jobin Joseph" />
    <link rel="canonical" href="https://craftcv.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://craftcv.vercel.app/" />
    <meta property="og:title" content="CraftCV — ATS Resume Builder" />
    <meta property="og:description" content="Build ATS-optimized resumes that actually land interviews. Free to use, no sign-up required to get started." />
    <meta property="og:image" content="https://craftcv.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CraftCV" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CraftCV — ATS Resume Builder" />
    <meta name="twitter:description" content="Build ATS-optimized resumes that actually land interviews." />
    <meta name="twitter:image" content="https://craftcv.vercel.app/og-image.png" />

    <!-- PWA / Mobile App appearance -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CraftCV" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <div style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#333;">
        <h2>CraftCV requires JavaScript</h2>
        <p>Please enable JavaScript in your browser settings to use CraftCV.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
