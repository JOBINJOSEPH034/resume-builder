<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ready-candidate.svg" />
    <!-- Viewport: width=device-width prevents zoom issues on iOS form inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Ready Candidate — Your Career Workspace</title>
    <meta name="description" content="Build and save your resume, refine your LinkedIn profile, and write a thoughtful cover letter in your personal Ready Candidate workspace." />
    <meta name="keywords" content="resume builder, ATS resume, job application, CV builder, ATS score, resume optimizer" />
    <meta name="author" content="Jobin Joseph" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ready Candidate — Your Career Workspace" />
    <meta property="og:description" content="Your resume, LinkedIn profile and cover letters, thoughtfully brought together." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Ready Candidate" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ready Candidate — Your Career Workspace" />
    <meta name="twitter:description" content="A personal workspace for your next career move." />

    <!-- PWA / Mobile App appearance -->
    <meta name="theme-color" content="#244b40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ready Candidate" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <div style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#333;">
        <h2>Ready Candidate requires JavaScript</h2>
        <p>Please enable JavaScript in your browser settings to use Ready Candidate.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
